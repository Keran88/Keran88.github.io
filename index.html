<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Keran's Cybersecurity Portfolio</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    /* Reset */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      color: #f4f4f4;
      text-align: center;
      padding: 50px 20px;
    }

    h1 {
      font-size: 3em;
      margin-bottom: 20px;
      color: #00ffe1;
    }

    p {
      font-size: 1.2em;
      margin-bottom: 40px;
      max-width: 600px;
      margin-left: auto;
      margin-right: auto;
    }

    .social-icons {
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    .social-icons a {
      text-decoration: none;
      color: #fff;
      border: 2px solid #00ffe1;
      padding: 10px 20px;
      border-radius: 25px;
      transition: all 0.3s ease;
      font-weight: bold;
    }

    .social-icons a:hover {
      background-color: #00ffe1;
      color: #0f2027;
      transform: scale(1.05);
      box-shadow: 0 0 10px #00ffe1;
    }

    footer {
      margin-top: 60px;
      font-size: 0.9em;
      color: #ccc;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 2em;
      }

      .social-icons {
        flex-direction: column;
        gap: 15px;
      }
    }
  </style>
</head>
<body>

  <h1>👋 Hi, I'm Keran</h1>
  <p>Welcome to my cybersecurity portfolio! I specialize in ethical hacking, security audits, and write-ups on TryHackMe/HTB. Scroll below to connect or collaborate!</p>

  <div class="social-icons">
    <a href="https://github.com/Keran88/Portfolio" target="_blank">🐙 GitHub</a>
    <a href="https://linkedin.com/in/keran0323" target="_blank">💼 LinkedIn</a>
    <a href="mailto:kiranillyasS@gmail.com">✉️ Email</a>
  </div>

  <footer>
    <p>&copy; 2025 Keran Ilyas. All rights reserved.</p>
  </footer>

</body>
</html>
